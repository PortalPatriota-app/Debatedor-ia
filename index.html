<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#111111">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Debatedor IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mnlszntcfbjdkjrfzinl.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #009c3b;
    --amarelo: #FFDF00;
    --azul: #002776;
    --branco: #f8f8f0;
    --cinza-escuro: #111;
    --cinza-medio: #1e1e1e;
    --cinza-claro: #2a2a2a;
    --borda: #333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--cinza-escuro);
    color: var(--branco);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  /* ═══ TELA DE BOAS-VINDAS ═══ */
  #tela-boas-vindas {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: clamp(8px, 2vh, 20px) 20px;
    padding-top: max(clamp(8px, 2vh, 20px), env(safe-area-inset-top));
    padding-bottom: max(clamp(8px, 2vh, 20px), env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 0%, #002776aa 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, #009c3b44 0%, transparent 50%),
                var(--cinza-escuro);
    text-align: center;
    gap: 0;
    overflow: hidden;
  }

  .logo-container {
    position: relative;
    margin-bottom: clamp(10px, 2.5vh, 24px);
    flex-shrink: 0;
  }

  .logo-circulo {
    width: clamp(64px, 12vh, 90px);
    height: clamp(64px, 12vh, 90px);
    border-radius: 50%;
    background: linear-gradient(135deg, var(--azul), #003a9e);
    border: 3px solid var(--amarelo);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: clamp(28px, 6vh, 40px);
    margin: 0 auto 0;
    box-shadow: 0 0 30px #FFDF0044, 0 4px 24px #00000088;
    animation: pulsar 3s ease-in-out infinite;
  }

  .logo-circulo img,
  .avatar-header img,
  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @keyframes pulsar {
    0%, 100% { box-shadow: 0 0 20px #FFDF0033, 0 4px 24px #00000088; }
    50% { box-shadow: 0 0 40px #FFDF0066, 0 4px 24px #00000088; }
  }

  .badge-online {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: var(--verde);
    border-radius: 50%;
    border: 2px solid var(--cinza-escuro);
  }

  .titulo-bv {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: clamp(30px, 6vh, 42px);
    letter-spacing: 3px;
    color: var(--amarelo);
    line-height: 1;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .subtitulo-bv {
    font-size: clamp(12px, 1.8vh, 15px);
    color: #aaa;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: clamp(10px, 2.5vh, 24px);
    flex-shrink: 0;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--verde), transparent);
    margin: 0 auto clamp(10px, 2.5vh, 24px);
    flex-shrink: 0;
  }

  .descricao-bv {
    font-size: clamp(13px, 1.9vh, 16px);
    color: #ccc;
    line-height: 1.55;
    max-width: 300px;
    margin-bottom: clamp(14px, 3vh, 32px);
    flex-shrink: 0;
  }

  .descricao-bv strong { color: var(--amarelo); }

  .form-nome {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .label-nome {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: left;
  }

  .input-nome {
    width: 100%;
    background: var(--cinza-medio);
    border: 1.5px solid var(--borda);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--branco);
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }

  .input-nome:focus { border-color: var(--amarelo); }
  .input-nome::placeholder { color: #555; }

  .btn-entrar {
    width: 100%;
    background: linear-gradient(135deg, var(--verde), #007a2f);
    border: none;
    border-radius: 10px;
    padding: 15px;
    color: white;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 18px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px #009c3b44;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-entrar:hover { transform: translateY(-1px); box-shadow: 0 6px 20px #009c3b66; }
  .btn-entrar:active { transform: translateY(0); }

  .rodape-bv {
    margin-top: 24px;
    font-size: 11px;
    color: #444;
    line-height: 1.6;
  }

  /* ═══ TELA DE CHAT ═══ */
  #tela-chat {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .chat-header {
    background: var(--cinza-medio);
    border-bottom: 1px solid var(--borda);
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar-header {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--azul), #003a9e);
    border: 2px solid var(--amarelo);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .avatar-header img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar-dot {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 11px;
    height: 11px;
    background: var(--verde);
    border-radius: 50%;
    border: 2px solid var(--cinza-medio);
  }

  .header-info { flex: 1; }

  .header-nome {
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--amarelo);
    line-height: 1;
  }

  .header-status {
    font-size: 11px;
    color: var(--verde);
    margin-top: 2px;
  }

  .header-bandeira {
    font-size: 22px;
    opacity: 0.8;
  }

  /* Atalhos */
  .atalhos-container {
    background: var(--cinza-medio);
    border-bottom: 1px solid var(--borda);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    scrollbar-width: none;
  }

  .atalhos-container::-webkit-scrollbar { display: none; }

  .btn-atalho {
    background: var(--cinza-claro);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 6px 13px;
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-atalho:hover {
    border-color: var(--amarelo);
    color: var(--amarelo);
    background: #2a2a1a;
  }

  /* Mensagens */
  .chat-mensagens {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .mensagem {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .mensagem.usuario { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-top: 2px;
    overflow: hidden;
  }

  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .msg-avatar.bot-av {
    background: linear-gradient(135deg, var(--azul), #003a9e);
    border: 1.5px solid var(--amarelo);
  }

  .msg-avatar.user-av {
    background: var(--cinza-claro);
    border: 1.5px solid var(--borda);
    font-size: 14px;
    font-weight: 600;
    color: var(--amarelo);
    font-family: 'Bebas Neue', 'Inter', sans-serif;
  }

  .msg-conteudo { max-width: calc(100% - 50px); }

  .msg-nome {
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .mensagem.usuario .msg-nome { text-align: right; }

  .msg-balao {
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 16px;
    line-height: 1.7;
    word-break: break-word;
  }

  .mensagem.bot .msg-balao {
    background: var(--cinza-medio);
    border: 1px solid var(--borda);
    border-top-left-radius: 4px;
    color: var(--branco);
  }

  .mensagem.usuario .msg-balao {
    background: linear-gradient(135deg, var(--azul), #003a9e);
    border-top-right-radius: 4px;
    color: white;
  }

  .msg-balao strong { color: var(--amarelo); }
  .msg-balao em { color: #aaa; font-style: normal; font-size: 12px; }

  /* Typing indicator */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    background: var(--cinza-medio);
    border: 1px solid var(--borda);
    padding: 10px 14px;
    border-radius: 16px;
    border-top-left-radius: 4px;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: #555;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); background: #555; }
    30% { transform: translateY(-5px); background: var(--amarelo); }
  }

  /* Input */
  .chat-input-area {
    background: var(--cinza-medio);
    border-top: 1px solid var(--borda);
    padding: 12px 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .input-wrapper {
    flex: 1;
    background: var(--cinza-claro);
    border: 1.5px solid var(--borda);
    border-radius: 22px;
    display: flex;
    align-items: center;
    padding: 4px 16px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within { border-color: var(--amarelo); }

  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--branco);
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    padding: 8px 0;
    resize: none;
    max-height: 100px;
    min-height: 36px;
    line-height: 1.5;
    -webkit-appearance: none;
    appearance: none;
  }

  .chat-input::placeholder { color: #555; }

  .btn-enviar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--verde), #007a2f);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 10px #009c3b44;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-enviar:hover { transform: scale(1.05); }
  .btn-enviar:active { transform: scale(0.95); }
  .btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Erro */
  .msg-erro {
    background: #2a1111;
    border: 1px solid #5a2020;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ff8888;
    text-align: center;
    margin: 4px 0;
  }
</style>
</head>
<body>
<div id="debug-versao" style="position:fixed;top:4px;right:6px;z-index:9999;background:#000;color:#0f0;font:11px monospace;padding:2px 6px;border-radius:4px;pointer-events:none;">v6</div>

<!-- ═══ TELA DE BOAS-VINDAS ═══ -->
<div id="tela-boas-vindas">
  <div class="logo-container">
    <div class="logo-circulo">
      <img src="avatar.png?v=5" alt="Debatedor" decoding="async">
    </div>
    <div class="badge-online"></div>
  </div>

  <div class="titulo-bv">DEBATEDOR IA</div>
  <div class="subtitulo-bv">Inteligência a serviço do Brasil</div>
  <div class="divider"></div>

  <p class="descricao-bv">
    Seu assistente para <strong>debates políticos</strong> com fatos, dados e argumentos sólidos.<br><br>
    Pronto para defender o Brasil com <strong>razão e verdade</strong>.
  </p>

  <div class="form-nome">
    <label class="label-nome">Como quer ser chamado?</label>
    <input
      type="text"
      id="input-nome-usuario"
      class="input-nome"
      placeholder="Digite seu nome ou apelido..."
      maxlength="30"
      autocomplete="off"
      autocapitalize="words"
      autocorrect="off"
      spellcheck="false"
    />
    <button type="button" class="btn-entrar" onclick="entrarNoChat()">
      🦅 QUERO DEBATER AGORA
    </button>
  </div>
</div>

<!-- ═══ TELA DE CHAT ═══ -->
<div id="tela-chat">

  <div class="chat-header">
    <div class="avatar-header">
      <img src="avatar.png?v=5" alt="" decoding="async">
      <div class="avatar-dot"></div>
    </div>
    <div class="header-info">
      <div class="header-nome">DEBATEDOR</div>
      <div class="header-status">● Online e pronto pra debater</div>
    </div>
    <div class="header-bandeira">🇧🇷</div>
  </div>

  <div class="atalhos-container" id="atalhos">
    <button type="button" class="btn-atalho" onclick="usarAtalho('Quais foram as principais realizações do governo Bolsonaro?')">🏆 Realizações</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('Como rebater o argumento de que Bolsonaro é fascista?')">🛡️ Rebater &quot;fascista&quot;</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('Como foi a economia no governo Bolsonaro?')">📊 Economia</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('Quais foram as principais fake news contra Bolsonaro?')">🚫 Fake news contra ele</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('O que aconteceu nas eleições de 2022?')">🗳️ Eleições 2022</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('Como defender o armamento da população?')">🔫 Armamento</button>
    <button type="button" class="btn-atalho" onclick="usarAtalho('Como rebater ataques ao governo Bolsonaro nas redes sociais?')">📱 Redes sociais</button>
  </div>

  <div class="chat-mensagens" id="mensagens">
    <!-- Mensagens aparecem aqui -->
  </div>

  <div class="typing-indicator" id="typing">
    <div class="msg-avatar bot-av">
      <img src="avatar.png?v=5" alt="" decoding="async">
    </div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Digite sua dúvida ou o argumento que precisa rebater..."
        rows="1"
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
      ></textarea>
    </div>
    <button type="button" class="btn-enviar" id="btn-enviar" onclick="enviarMensagem()">
      ➤
    </button>
  </div>

</div>

<script>
// ═══ CONFIGURAÇÃO ═══
var BACKEND_URL = 'https://mnlszntcfbjdkjrfzinl.supabase.co/functions/v1/patriota';

var nomeUsuario = '';
var inicialUsuario = '';
var historico = [];

// ═══ TRAVA DE ALTURA — força as telas a ocupar EXATAMENTE a área visível ═══
var _ultimaAltura = 0;
var _agendado = false;
function _aplicarAltura() {
  _agendado = false;
  var h = 0;
  if (window.visualViewport && window.visualViewport.height) {
    h = Math.round(window.visualViewport.height);
  } else {
    h = document.documentElement.clientHeight || window.innerHeight || 0;
  }
  if (!h) return;
  // Ignora mudanças minúsculas para evitar vibração em loop.
  if (Math.abs(h - _ultimaAltura) < 4) return;
  _ultimaAltura = h;
  var px = h + 'px';
  document.documentElement.style.height = px;
  document.body.style.height = px;
  var bv = document.getElementById('tela-boas-vindas');
  var tc = document.getElementById('tela-chat');
  if (bv) { bv.style.height = px; bv.style.maxHeight = px; }
  if (tc) { tc.style.height = px; tc.style.maxHeight = px; }
}
function travarAltura() {
  if (_agendado) return;
  _agendado = true;
  (window.requestAnimationFrame || function (f) { setTimeout(f, 16); })(_aplicarAltura);
}
travarAltura();
window.addEventListener('load', travarAltura);
window.addEventListener('resize', travarAltura);
window.addEventListener('orientationchange', function () { setTimeout(travarAltura, 300); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', travarAltura);
  // NÃO escutar 'scroll' — cria loop de vibração em alguns WebViews.
}

// ═══ ENTRADA NO CHAT ═══
function entrarNoChat() {
  var input = document.getElementById('input-nome-usuario');
  var nome = input.value.trim();

  if (!nome) {
    input.focus();
    input.style.borderColor = '#ff4444';
    setTimeout(function () { input.style.borderColor = ''; }, 1000);
    return;
  }

  nomeUsuario = nome;
  inicialUsuario = nome.charAt(0).toUpperCase();

  document.getElementById('tela-boas-vindas').style.display = 'none';
  document.getElementById('tela-chat').style.display = 'flex';

  var boasVindas = 'E aí, ' + nomeUsuario + '! 🇧🇷 Sou o Debatedor, seu parceiro de debates.\n\n' +
    'Se alguém vier com papo de esquerda ou quiser distorcer a história do nosso país, você não vai estar sozinho. Pode me perguntar qualquer coisa sobre o governo Bolsonaro, políticas públicas, economia — o que precisar para chegar com argumento sólido.\n\n' +
    'O que você quer saber?';

  adicionarMensagem('bot', boasVindas);
}

// Enter na tela de boas-vindas
document.getElementById('input-nome-usuario').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') entrarNoChat();
});

// ═══ ATALHOS ═══
function usarAtalho(texto) {
  var input = document.getElementById('chat-input');
  input.value = texto;
  autoResize(input);
  enviarMensagem();
}

// ═══ ENVIAR MENSAGEM ═══
function enviarMensagem() {
  var input = document.getElementById('chat-input');
  var texto = input.value.trim();
  if (!texto) return;

  var btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  input.value = '';
  autoResize(input);

  adicionarMensagem('usuario', texto);
  historico.push({ role: 'user', content: texto });

  mostrarTyping(true);
  scrollParaBaixo();

  fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: historico, userName: nomeUsuario })
  })
    .then(function (resposta) {
      if (!resposta.ok) throw new Error('Erro na requisição');
      return resposta.json();
    })
    .then(function (dados) {
      var textoResposta =
        (dados.content && dados.content[0] && dados.content[0].text) ||
        dados.text ||
        'Não consegui responder agora.';
      historico.push({ role: 'assistant', content: textoResposta });
      mostrarTyping(false);
      adicionarMensagem('bot', textoResposta);
    })
    .catch(function () {
      mostrarTyping(false);
      adicionarErro('Erro ao conectar. Verifique sua conexão e tente novamente.');
      historico.pop();
    })
    .then(function () {
      btn.disabled = false;
      input.focus();
    });
}

// ═══ UI HELPERS ═══
function adicionarMensagem(tipo, texto) {
  var container = document.getElementById('mensagens');

  var wrapper = document.createElement('div');
  wrapper.className = 'mensagem ' + tipo;

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + (tipo === 'bot' ? 'bot-av' : 'user-av');
  if (tipo === 'bot') {
    var img = document.createElement('img');
    img.src = 'avatar.png?v=5';
    img.alt = '';
    img.decoding = 'async';
    avatar.appendChild(img);
  } else {
    avatar.textContent = inicialUsuario;
  }

  var conteudo = document.createElement('div');
  conteudo.className = 'msg-conteudo';

  var nome = document.createElement('div');
  nome.className = 'msg-nome';
  nome.textContent = tipo === 'bot' ? 'Debatedor' : nomeUsuario;

  var balao = document.createElement('div');
  balao.className = 'msg-balao';
  balao.innerHTML = formatarTexto(texto);

  conteudo.appendChild(nome);
  conteudo.appendChild(balao);
  wrapper.appendChild(avatar);
  wrapper.appendChild(conteudo);
  container.appendChild(wrapper);

  scrollParaBaixo();
}

function adicionarErro(msg) {
  var container = document.getElementById('mensagens');
  var div = document.createElement('div');
  div.className = 'msg-erro';
  div.textContent = msg;
  container.appendChild(div);
  scrollParaBaixo();
}

function mostrarTyping(mostrar) {
  var el = document.getElementById('typing');
  el.style.display = mostrar ? 'flex' : 'none';
  if (mostrar) {
    var container = document.getElementById('mensagens');
    container.appendChild(el);
    scrollParaBaixo();
  }
}

function scrollParaBaixo() {
  var container = document.getElementById('mensagens');
  setTimeout(function () { container.scrollTop = container.scrollHeight; }, 50);
}

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatarTexto(texto) {
  return escapeHTML(texto)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviarMensagem();
  }
}
</script>
